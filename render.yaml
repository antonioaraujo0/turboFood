# -----------------------------------------------------------------------------
# Blueprint do Render para o TurboFood (backend + frontend + banco Postgres)
#
# Como usar:
#   1. Suba este repositório no GitHub.
#   2. No Render: New > Blueprint > selecione o repositório.
#   3. O Render cria os 3 recursos abaixo automaticamente.
#   4. Após o deploy, ajuste CORS_ORIGIN (backend) e VITE_API_URL (frontend)
#      com as URLs reais geradas, caso queira travar o CORS.
# -----------------------------------------------------------------------------

databases:
  - name: turbofood-db
    databaseName: turbofood
    plan: free

services:
  # ------------------------------- BACKEND ---------------------------------
  - type: web
    name: turbofood-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Conexão do Postgres gerenciado do Render (com SSL automático).
      - key: DATABASE_URL
        fromDatabase:
          name: turbofood-db
          property: connectionString
      # Origem do frontend liberada no CORS. Atualize com a URL do static site.
      - key: CORS_ORIGIN
        sync: false

  # ------------------------------- FRONTEND --------------------------------
  - type: web
    name: turbofood-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # URL pública do backend. Atualize com a URL do turbofood-api.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA: qualquer rota cai no index.html (React Router).
      - type: rewrite
        source: /*
        destination: /index.html
